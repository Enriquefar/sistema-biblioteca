spring.application.name=biblioteca

# H2 em ARQUIVO (grava em ./data/biblioteca.mv.db) -> os dados sobrevivem ao reinício da aplicação.
# Obs.: "jdbc:h2:mem:..." (padrão) seria só memória e perderia tudo ao reiniciar.
spring.datasource.url=jdbc:h2:file:./data/biblioteca
spring.datasource.username=sa
spring.datasource.password=

# JPA: cria/atualiza a tabela LIVRO a partir da classe @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
