<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias</title>
</head>
<body>
<h1>Categorias cadastradas</h1>

<p>Total de categorias: <span th:text="${categorias.size()}">0</span></p>

<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="categoria : ${categorias}">
        <td th:text="${categoria.id}"></td>
        <td th:text="${categoria.nome}"></td>
        <td th:text="${categoria.descricao}"></td>
        <td>
            <form th:action="@{/categorias/{id}/excluir(id=${categoria.id})}" method="post"
                  onsubmit="return confirm('Excluir esta categoria?');">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<p><a th:href="@{/categorias/novo}">Cadastrar nova categoria</a></p>
</body>
</html>
